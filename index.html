<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ION9000 Test</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
body {
  font-family: -apple-system, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 16px;
  color: #1a202c;
}
.box {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  margin-bottom: 16px;
}
h1 { font-size: 18px; margin: 0 0 12px; color: #4CAF50; }
h2 { font-size: 15px; margin: 0 0 12px; }
input {
  width: 100%;
  padding: 12px;
  border: 2px solid #e2e8f0;
  border-radius: 8px;
  font-size: 15px;
  margin-bottom: 10px;
  box-sizing: border-box;
}
button {
  width: 100%;
  padding: 12px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 8px;
}
button:active { opacity: 0.8; }
button.sec {
  background: #3182ce;
}
button.ter {
  background: #ed8936;
}
#err { color: red; font-size: 13px; margin-top: 8px; min-height: 18px; }
#log {
  background: #1a202c;
  color: #4CAF50;
  font-family: monospace;
  font-size: 11px;
  padding: 12px;
  border-radius: 8px;
  max-height: 200px;
  overflow: auto;
  white-space: pre-wrap;
  margin-bottom: 16px;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.mini-card {
  background: white;
  border-radius: 8px;
  padding: 10px;
  border-left: 3px solid #4CAF50;
  font-size: 12px;
}
.mini-card .t {
  font-size: 10px;
  color: #718096;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.mini-card .v {
  font-size: 16px;
  font-weight: bold;
}
canvas { max-height: 250px; }
.hidden { display: none; }
.chip-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 10px;
}
.chip {
  padding: 8px 12px;
  background: #f5f7fa;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  font-size: 12px;
  white-space: nowrap;
  cursor: pointer;
}
.chip.sel {
  background: #4CAF50;
  color: white;
  border-color: #4CAF50;
}
.period-row {
  display: flex;
  gap: 4px;
  background: #f5f7fa;
  padding: 4px;
  border-radius: 8px;
  margin-bottom: 12px;
}
.period {
  flex: 1;
  padding: 8px;
  background: transparent;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
  color: #718096;
  cursor: pointer;
  margin: 0;
}
.period.sel {
  background: #4CAF50;
  color: white;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginBox" class="box">
  <h1>⚡ ION9000 Test</h1>
  <input id="u" placeholder="Username" autocomplete="username">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="login()">Login</button>
  <div id="err"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="box">
    <h1>⚡ ION9000</h1>
    <button class="sec" onclick="loadRealtime()">🔄 Refresh Nilai</button>
    <button class="ter" onclick="loadChart()">📈 Muat Grafik</button>
    <button onclick="logout()" style="background:#e53e3e;">Logout</button>
  </div>

  <div id="log">Menunggu...</div>

  <div id="cards" class="card-grid"></div>

  <div class="box">
    <h2>📈 Grafik</h2>
    <div class="period-row">
      <button class="period sel" data-p="1d" onclick="setP('1d')">1 Hari</button>
      <button class="period" data-p="1w" onclick="setP('1w')">1 Minggu</button>
      <button class="period" data-p="1m" onclick="setP('1m')">1 Bulan</button>
    </div>
    <div id="chips" class="chip-row"></div>
    <canvas id="chart"></canvas>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxAFAVCym991JDn6hsSyCQj0M1dve1r-QtJbdN4s0e2NFic328ULlXGPfRFV04Zow_GKQ/exec";

let token = null;
let user = null;
let period = '1d';
let params = new Set();
let chartObj = null;

function log(msg) {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  el.textContent = '[' + time + '] ' + msg + '\n' + el.textContent;
  console.log(msg);
}

async function login() {
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  const err = document.getElementById('err');

  err.textContent = '';
  if (!u || !p) { err.textContent = 'Isi username & password'; return; }

  log('Login: ' + u);

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'login', username: u, password: p })
    });
    const data = await res.json();
    log('Login response: ' + JSON.stringify(data));

    if (data.status !== 'success' || !data.token) {
      err.textContent = data.message || 'Login gagal';
      return;
    }

    token = data.token;
    user = data.user;
    localStorage.setItem('tk', token);
    localStorage.setItem('us', user);
    localStorage.setItem('ex', data.expires);

    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    loadRealtime();
  } catch (e) {
    err.textContent = 'Error: ' + e.message;
    log('Login error: ' + e.message);
  }
}

function logout() {
  localStorage.clear();
  location.reload();
}

// Auto-login
window.onload = function() {
  const tk = localStorage.getItem('tk');
  const us = localStorage.getItem('us');
  const ex = parseInt(localStorage.getItem('ex') || '0');
  if (tk && us && ex > Date.now()) {
    token = tk;
    user = us;
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    loadRealtime();
  }
  log('Halaman dimuat. Token: ' + (token ? 'ada' : 'tidak ada'));
};

async function apiCall(action, params2) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  url.searchParams.set('token', token);
  if (params2) {
    Object.keys(params2).forEach(k => url.searchParams.set(k, params2[k]));
  }
  log('GET ' + action + ' ...');
  const res = await fetch(url.toString());
  const data = await res.json();
  log('→ ' + action + ': ' + JSON.stringify(data).substring(0, 150));
  return data;
}

async function loadRealtime() {
  try {
    const data = await apiCall('realtime');
    if (!data.data) {
      document.getElementById('cards').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:#718096;">Belum ada data</div>';
      return;
    }
    renderCards(data.data);
  } catch (e) {
    log('Realtime error: ' + e.message);
  }
}

function renderCards(d) {
  const container = document.getElementById('cards');
  let html = '';
  Object.keys(d).forEach(k => {
    if (k === 'timestamp') return;
    let val = d[k];
    if (typeof val === 'number') val = val.toFixed(2);
    html += `<div class="mini-card"><div class="t">${k}</div><div class="v">${val}</div></div>`;
  });
  container.innerHTML = html;

  // Load chips (untuk grafik)
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  Object.keys(d).forEach(k => {
    if (k === 'timestamp' || k === 'cb_status') return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = k;
    chip.onclick = () => toggleParam(k, chip);
    chips.appendChild(chip);
  });
}

function toggleParam(p, el) {
  if (params.has(p)) {
    params.delete(p);
    el.classList.remove('sel');
  } else {
    params.add(p);
    el.classList.add('sel');
  }
}

function setP(p) {
  period = p;
  document.querySelectorAll('.period').forEach(b => {
    b.classList.toggle('sel', b.dataset.p === p);
  });
}

async function loadChart() {
  if (params.size === 0) {
    log('Pilih parameter dulu!');
    alert('Pilih minimal 1 parameter dulu');
    return;
  }

  log('Load chart: period=' + period + ', params=' + Array.from(params).join(','));

  const datasets = [];
  const colors = ['#4CAF50', '#3182ce', '#ed8936', '#e53e3e', '#805ad5'];
  let i = 0;

  for (const p of params) {
    try {
      const data = await apiCall('chart', { period: period, param: p });

      if (data.status === 'success' && data.data && data.data.length > 0) {
        datasets.push({
          label: p,
          data: data.data.map(d => ({ x: d.t, y: d.avg })),
          borderColor: colors[i % colors.length],
          borderWidth: 2,
          tension: 0.3,
          pointRadius: 0,
          spanGaps: true
        });
        log('  ' + p + ': ' + data.data.length + ' titik (raw: ' + (data.meta ? data.meta.totalRaw : '?') + ')');
        i++;
      } else {
        log('  ' + p + ': tidak ada data');
      }
    } catch (e) {
      log('  ' + p + ' error: ' + e.message);
    }
  }

  if (chartObj) chartObj.destroy();

  if (datasets.length === 0) {
    alert('Tidak ada data untuk parameter/periode ini');
    return;
  }

  const ctx = document.getElementById('chart').getContext('2d');
  chartObj = new Chart(ctx, {
    type: 'line',
    data: { datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { boxWidth: 10, font: { size: 10 } } } },
      scales: {
        x: {
          type: 'time',
          time: { displayFormats: { hour: 'HH:mm', day: 'dd/MM' } },
          ticks: { maxTicksLimit: 5, font: { size: 10 } }
        },
        y: { ticks: { maxTicksLimit: 5, font: { size: 10 } } }
      }
    }
  });

  log('✅ Chart rendered: ' + datasets.length + ' dataset');
}
</script>
</body>
</html>
